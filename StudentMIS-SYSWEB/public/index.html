<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学生成绩管理系统 (Web版)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <h2 class="mb-4 text-center">学生成绩信息管理系统</h2>
        
        <!-- 添加学生表单 -->
        <div class="card mb-4">
            <div class="card-body">
                <form id="addForm" class="row g-3">
                    <div class="col-md-2"><input type="text" class="form-control" id="stuId" placeholder="学号" required></div>
                    <div class="col-md-2"><input type="text" class="form-control" id="stuName" placeholder="姓名" required></div>
                    <div class="col-md-2">
                        <select class="form-select" id="stuGender">
                            <option value="M">男 (M)</option>
                            <option value="F">女 (F)</option>
                        </select>
                    </div>
                    <div class="col-md-1"><input type="number" class="form-control" id="grade1" placeholder="成绩1" required></div>
                    <div class="col-md-1"><input type="number" class="form-control" id="grade2" placeholder="成绩2" required></div>
                    <div class="col-md-1"><input type="number" class="form-control" id="grade3" placeholder="成绩3" required></div>
                    <div class="col-md-3">
                        <button type="button" class="btn btn-primary w-100" onclick="addStudent()">添加 / 更新</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- 操作按钮与数据表格 -->
        <div class="d-flex justify-content-between mb-2">
            <h4>学生列表</h4>
            <button class="btn btn-success" onclick="loadStudents(true)">按总分降序排序</button>
        </div>
        
        <table class="table table-bordered table-hover bg-white text-center">
            <thead class="table-dark">
                <tr>
                    <th>学号</th><th>姓名</th><th>性别</th>
                    <th>成绩1</th><th>成绩2</th><th>成绩3</th>
                    <th>总分</th><th>操作</th>
                </tr>
            </thead>
            <tbody id="studentTableBody">
                <!-- 数据将由 JS 动态填充 -->
            </tbody>
        </table>
    </div>

    <script>
        // 页面加载时获取数据
        document.addEventListener("DOMContentLoaded", () => loadStudents(false));

        // 获取并渲染学生列表
        async function loadStudents(sort) {
            const response = await fetch(`/api/students${sort ? '?sort=true' : ''}`);
            const students = await response.json();
            const tbody = document.getElementById('studentTableBody');
            tbody.innerHTML = '';
            
            students.forEach(s => {
                const total = s.grades.reduce((a, b) => a + b, 0);
                tbody.innerHTML += `
                    <tr>
                        <td>${s.id}</td><td>${s.name}</td><td>${s.gender}</td>
                        <td>${s.grades[0]}</td><td>${s.grades[1]}</td><td>${s.grades[2]}</td>
                        <td class="fw-bold text-primary">${total}</td>
                        <td>
                            <button class="btn btn-sm btn-danger" onclick="deleteStudent('${s.id}')">删除</button>
                        </td>
                    </tr>
                `;
            });
        }

        // 添加或更新学生
        async function addStudent() {
            const student = {
                id: document.getElementById('stuId').value,
                name: document.getElementById('stuName').value,
                gender: document.getElementById('stuGender').value,
                grades: [
                    parseFloat(document.getElementById('grade1').value),
                    parseFloat(document.getElementById('grade2').value),
                    parseFloat(document.getElementById('grade3').value)
                ]
            };

            await fetch('/api/students', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(student)
            });
            
            document.getElementById('addForm').reset();
            loadStudents(false);
        }

        // 删除学生
        async function deleteStudent(id) {
            if(confirm(`确定要删除学号为 ${id} 的学生吗？`)) {
                await fetch(`/api/students?id=${id}`, { method: 'DELETE' });
                loadStudents(false);
            }
        }
    </script>
</body>
</html>
